<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Policies | TeamSpace HR</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="stylesheet" href="../../shared/footer.css">
  <link rel="stylesheet" href="../../shared/hr-sidebar.css">
  <link rel="stylesheet" href="../../shared/hr-layout.css">
  <link rel="stylesheet" href="policies.css">
</head>
<body class="has-footer">
  <nav class="navbar" data-navbar="hr"></nav>
  <main class="hr-page-shell">
    <aside class="hr-sidebar" data-hr-sidebar data-hr-sidebar-active="policies" aria-label="HR workspace"></aside>
    <div class="hr-page-content policies-page">
      <header id="pageHeader">
        <p class="eyebrow">HR GUIDANCE</p>
        <div id="headerTop">
          <div><h1>Company Policies</h1><p>Workplace regulations, security, and company standards.</p></div>
          <div id="editControls">
            <button id="addBtn" type="button"><i class="bi bi-plus-lg" aria-hidden="true"></i> Add New Policy</button>
            <button id="editBtn" type="button"><i class="bi bi-pencil-square" aria-hidden="true"></i> Edit Policies</button>
            <button id="saveBtn" type="button" class="hidden"><i class="bi bi-check-lg" aria-hidden="true"></i> Save</button>
            <button id="cancelBtn" type="button" class="hidden">Cancel</button>
          </div>
        </div>
      </header>
      <p id="policyMessage" class="policy-message" role="status" aria-live="polite" hidden></p>
      <div id="main">
        <section id="content" aria-label="Policies">
          <p id="intro">View and manage the current company policies below.</p>
          <div id="policiesContainer"></div>
          <div id="downloadArea">
            <p>Download the latest policies saved in the database.</p>
            <button id="pdf" type="button"><i class="bi bi-download" aria-hidden="true"></i> Download Policies</button>
          </div>
        </section>
        <aside id="rightSide" aria-label="Policy navigation">
          <div id="policyLinksCard"><h2><i class="bi bi-file-earmark-text" aria-hidden="true"></i> Policies on this page</h2><nav id="policyLinks" aria-label="Policies on this page"></nav></div>
        </aside>
      </div>
    </div>
  </main>
  <dialog id="policyDialog" class="policy-dialog" aria-labelledby="policyDialogTitle">
    <form id="policyForm">
      <div class="policy-dialog-heading"><div><p class="eyebrow">HR GUIDANCE</p><h2 id="policyDialogTitle">Add New Policy</h2><p>Create a policy that employees can read.</p></div><button id="closePolicyDialog" type="button" class="policy-close" aria-label="Close">×</button></div>
      <label for="policyTitle">Policy title</label><input id="policyTitle" name="title" maxlength="120" required>
      <label for="policyCategory">Category</label><input id="policyCategory" name="category" maxlength="60" placeholder="e.g. Security" required>
      <label for="policyDescription">Description</label><textarea id="policyDescription" name="description" rows="6" maxlength="3000" required></textarea>
      <p id="policyFormError" class="policy-form-error" role="alert" hidden></p>
      <div class="policy-dialog-actions"><button id="cancelPolicyDialog" type="button">Cancel</button><button id="createPolicy" type="submit">Add Policy</button></div>
    </form>
  </dialog>
  <footer class="site-footer" data-footer></footer>
  <script src="../../shared/footer.js"></script>
  <script src="../../shared/navbar.js?v=2"></script>
  <script src="../../shared/hr-sidebar.js"></script>
  <script src="policies.js?v=4"></script>
</body>
</html>
