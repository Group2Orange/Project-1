<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HR Helpdesk</title>


    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    >


    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >


    <link
        rel="stylesheet"
        href="../../shared/shared.css"
    >

    <link
        rel="stylesheet"
        href="../../shared/hr-sidebar.css"
    >

    <link
        rel="stylesheet"
        href="../../shared/footer.css"
    >

    <link
        rel="stylesheet"
        href="hrHelpdesk.css"
    >

</head>


<body class="has-footer">


    <!-- Navbar خارجي -->
    <nav
        class="navbar"
        data-navbar="hr">
    </nav>



    <main class="hr-helpdesk-page">


        <div class="hr-helpdesk-layout">


            <!-- Sidebar خارجي -->
            <aside
                class="hr-sidebar"
                data-hr-sidebar
                data-hr-sidebar-active="helpdesk">
            </aside>



            <section class="hr-helpdesk-content">


                <!-- Header -->
                <header class="hr-helpdesk-header">


                    <div>

                        <p class="page-eyebrow">
                            HR WORKSPACE
                        </p>

                        <h1>
                            Helpdesk Management
                        </h1>

                        <p class="page-description">
                            Manage employee tickets
                            and 1:1 meetings.
                        </p>

                    </div>


                    <button
                        class="create-button"
                        onclick="createTicketButton()">

                        + Create on Behalf

                    </button>


                </header>



                <!-- Statistics -->
                <section class="hr-statistics-grid">


                    <article class="statistic-card">

                        <small>
                            Active Tickets
                        </small>

                        <strong id="hr-active-tickets-number">
                            0
                        </strong>

                    </article>


                    <article class="statistic-card">

                        <small>
                            Pending Meetings
                        </small>

                        <strong id="hr-pending-meetings-number">
                            0
                        </strong>

                    </article>


                    <article class="statistic-card">

                        <small>
                            Confirmed Meetings
                        </small>

                        <strong id="hr-confirmed-meetings-number">
                            0
                        </strong>

                    </article>


                    <article class="statistic-card">

                        <small>
                            Total Requests
                        </small>

                        <strong id="hr-total-requests-number">
                            0
                        </strong>

                    </article>


                </section>



                <!-- Requests -->
                <section class="requests-panel">


                    <div class="panel-heading">

                        <div>

                            <p class="section-label">
                                REQUEST INBOX
                            </p>

                            <h2>
                                Employee Requests
                            </h2>

                        </div>

                    </div>



                    <!-- Tabs -->
                    <div class="tabs">


                        <button
                            id="all-requests-tab"
                            class="tab-button active-tab"
                            onclick="allRequestsTabButton()">

                            All

                        </button>


                        <button
                            id="tickets-tab"
                            class="tab-button"
                            onclick="ticketsTabButton()">

                            Tickets

                        </button>


                        <button
                            id="meetings-tab"
                            class="tab-button"
                            onclick="meetingsTabButton()">

                            1:1 Meetings

                        </button>


                    </div>



                    <!-- Filters -->
                    <div class="filters">


                        <input
                            id="hr-search-input"
                            type="search"
                            placeholder="Search employee or subject..."
                            oninput="showHrRequests()"
                        >


                        <select
                            id="hr-status-filter"
                            onchange="showHrRequests()">

                            <option value="all">
                                All Statuses
                            </option>

                            <option>
                                In Review
                            </option>

                            <option>
                                Assigned
                            </option>

                            <option>
                                Pending Meeting
                            </option>

                            <option>
                                Reschedule Requested
                            </option>

                            <option>
                                Confirmed
                            </option>

                            <option>
                                Resolved
                            </option>

                            <option>
                                Rejected
                            </option>

                        </select>


                        <select
                            id="hr-sort-select"
                            onchange="showHrRequests()">

                            <option value="newest">
                                Newest First
                            </option>

                            <option value="oldest">
                                Oldest First
                            </option>

                        </select>


                        <button
                            class="secondary-button"
                            onclick="resetHrFiltersButton()">

                            Reset

                        </button>


                    </div>



                    <div
                        id="hr-requests-container"
                        class="requests-container">
                    </div>


                </section>


            </section>


        </div>


    </main>



    <!-- Message -->
    <div
        id="hr-page-message"
        class="page-message">
    </div>



    <!-- Manage Request Dialog -->
    <dialog
        id="manage-request-dialog"
        class="hr-dialog">


        <div class="dialog-header">


            <div>

                <h2 id="manage-request-title">
                    Manage Request
                </h2>

                <p id="manage-request-employee">
                </p>

            </div>


            <button
                class="icon-button"
                onclick="closeManageRequestDialog()">

                ✕

            </button>


        </div>



        <div class="dialog-body">


            <div class="form-field">

                <label>
                    Status
                </label>

                <select id="manage-request-status-select">

                    <option>
                        In Review
                    </option>

                    <option>
                        Assigned
                    </option>

                    <option>
                        Pending Meeting
                    </option>

                    <option>
                        Reschedule Requested
                    </option>

                    <option>
                        Confirmed
                    </option>

                    <option>
                        Resolved
                    </option>

                    <option>
                        Rejected
                    </option>

                </select>

            </div>



            <div class="form-field">

                <label>
                    Reply to Employee
                </label>

                <textarea
                    id="manage-request-reply-input"
                    rows="5">
                </textarea>

            </div>



            <div
                id="manage-meeting-fields"
                class="meeting-box hide-element">


                <h3>
                    Meeting Schedule
                </h3>


                <div class="two-columns">


                    <div class="form-field full-width">

                        <label>
                            Date
                        </label>

                        <input
                            id="manage-meeting-date-input"
                            type="date"
                        >

                    </div>


                    <div class="form-field">

                        <label>
                            From
                        </label>

                        <input
                            id="manage-meeting-start-input"
                            type="time"
                        >

                    </div>


                    <div class="form-field">

                        <label>
                            To
                        </label>

                        <input
                            id="manage-meeting-end-input"
                            type="time"
                        >

                    </div>


                    <div class="form-field full-width">

                        <label>
                            Channel
                        </label>

                        <select id="manage-meeting-channel-select">

                            <option>
                                Zoom
                            </option>

                            <option>
                                Google Meet
                            </option>

                        </select>

                    </div>


                </div>


            </div>


        </div>



        <div class="dialog-actions">


            <button
                class="secondary-button"
                onclick="closeManageRequestDialog()">

                Cancel

            </button>


            <button
                class="primary-button"
                onclick="saveManagedRequestButton()">

                Save Changes

            </button>


        </div>


    </dialog>



    <!-- Create on Behalf Dialog -->
    <dialog
        id="create-ticket-dialog"
        class="hr-dialog">


        <div class="dialog-header">

            <h2>
                Create on Behalf
            </h2>

            <button
                class="icon-button"
                onclick="closeCreateTicketDialog()">

                ✕

            </button>

        </div>



        <div class="dialog-body">


            <div class="form-field">

                <label>
                    Employee
                </label>

                <select id="create-ticket-employee-select">

                    <option value="">
                        Select Employee
                    </option>

                </select>

            </div>



            <div class="two-columns">


                <div class="form-field">

                    <label>
                        Request Type
                    </label>

                    <select
                        id="create-ticket-type-select"
                        onchange="createTicketTypeChange()">

                        <option value="ticket">
                            Standard Ticket
                        </option>

                        <option value="meeting">
                            1:1 Meeting
                        </option>

                    </select>

                </div>



                <div class="form-field">

                    <label>
                        Category
                    </label>

                    <select id="create-ticket-category-select">

                        <option>
                            General HR Support
                        </option>

                        <option>
                            Payroll, Bonus & Compensation
                        </option>

                        <option>
                            Benefits
                        </option>

                        <option>
                            Workplace Issues
                        </option>

                        <option>
                            Policy Question
                        </option>

                    </select>

                </div>


            </div>



            <div class="form-field">

                <label>
                    Subject
                </label>

                <input
                    id="create-ticket-subject-input"
                    type="text"
                >

            </div>



            <div class="form-field">

                <label>
                    Details
                </label>

                <textarea
                    id="create-ticket-details-input"
                    rows="5">
                </textarea>

            </div>



            <div
                id="create-ticket-meeting-fields"
                class="meeting-box hide-element">


                <div class="two-columns">


                    <div class="form-field full-width">

                        <label>
                            Date
                        </label>

                        <input
                            id="create-meeting-date-input"
                            type="date"
                        >

                    </div>


                    <div class="form-field">

                        <label>
                            From
                        </label>

                        <input
                            id="create-meeting-start-input"
                            type="time"
                        >

                    </div>


                    <div class="form-field">

                        <label>
                            To
                        </label>

                        <input
                            id="create-meeting-end-input"
                            type="time"
                        >

                    </div>


                    <div class="form-field full-width">

                        <label>
                            Channel
                        </label>

                        <select id="create-meeting-channel-select">

                            <option>
                                Zoom
                            </option>

                            <option>
                                Google Meet
                            </option>

                        </select>

                    </div>


                </div>


            </div>


        </div>



        <div class="dialog-actions">


            <button
                class="secondary-button"
                onclick="closeCreateTicketDialog()">

                Cancel

            </button>


            <button
                class="primary-button"
                onclick="saveCreateTicketButton()">

                Create Request

            </button>


        </div>


    </dialog>



    <!-- Footer خارجي -->
    <footer
        class="site-footer"
        data-footer>
    </footer>



    <script src="../../shared/navbar.js?v=2"></script>

    <script src="../../shared/hr-sidebar.js"></script>

    <script src="../../shared/footer.js"></script>

    <script src="hrHelpdesk.js"></script>


</body>

</html>
