<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave and Early-Departure Requests | HR System</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="stylesheet" href="../../shared/footer.css">

<body class="has-footer">
  <nav class="navbar" data-navbar="hr"></nav>
  <main class="operations-layout">
    <aside class="hr-sidebar" data-hr-sidebar data-hr-sidebar-active="requests" aria-label="HR workspace"></aside>
    <section class="operations-content">
      <header><p class="operations-kicker">PEOPLE OPERATIONS</p><h1>Leave Requests</h1><p>Review company leave and early-departure requests.</p></header>
      <p id="requestMessage" class="operations-message" role="status" aria-live="polite"></p>
      <div class="operations-toolbar"><label>Search employee or leave type<input id="requestSearch" type="search" placeholder="Search requests"></label><label>Status<select id="requestStatus"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option></select></label></div>
      <div id="requestList" class="operations-list"></div>
    </section>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script src="../../shared/footer.js"></script>
  <script src="../../shared/navbar.js?v=2"></script>
  <script src="../../shared/hr-sidebar.js"></script>
