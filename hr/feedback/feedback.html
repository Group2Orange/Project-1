<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Inbox | Connectra</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="stylesheet" href="../../shared/footer.css">
  <link rel="stylesheet" href="../../shared/hr-sidebar.css">
  <link rel="stylesheet" href="../../shared/hr-layout.css">
  <link rel="stylesheet" href="feedback.css">
</head>
<body class="has-footer">
  <div data-navbar-guard="hr" hidden></div>
  <main class="hr-page-shell">
    <aside class="hr-sidebar" data-hr-sidebar data-hr-sidebar-active="feedback" aria-label="HR workspace"></aside>
    <section class="hr-page-content feedback-page" aria-labelledby="feedbackTitle">
      <header class="feedback-heading">
        <div><p class="eyebrow">EMPLOYEE VOICE</p><h1 id="feedbackTitle">Feedback Inbox</h1><p>Review suggestions and questions submitted by your team.</p></div>
        <button class="button button-light" id="refreshFeedback" type="button"><span class="material-symbols-outlined" aria-hidden="true">refresh</span>Refresh</button>
      </header>
      <section class="feedback-stats" aria-label="Feedback summary">
        <article><span>Total submissions</span><strong id="totalFeedback">—</strong><small>All categories</small><i class="material-symbols-outlined" aria-hidden="true">forum</i></article>
        <article><span>Unread</span><strong id="unreadFeedback">—</strong><small>Waiting for review</small><i class="material-symbols-outlined" aria-hidden="true">mark_email_unread</i></article>
        <article><span>High priority</span><strong id="highFeedback">—</strong><small>Flagged by HR</small><i class="material-symbols-outlined" aria-hidden="true">priority_high</i></article>
      </section>
      <section class="feedback-panel" aria-label="Feedback submissions">
        <div class="feedback-toolbar">
          <label class="feedback-search"><span class="material-symbols-outlined" aria-hidden="true">search</span><input id="feedbackSearch" type="search" placeholder="Search subject, message, or employee" aria-label="Search feedback"></label>
          <label><span class="visually-hidden">Category</span><select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select></label>
          <label><span class="visually-hidden">Sort</span><select id="sortFeedback" aria-label="Sort feedback"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
        </div>
        <p id="feedbackMessage" class="feedback-message" role="status" aria-live="polite">Loading feedback…</p>
        <div id="feedbackList" class="feedback-list"></div>
      </section>
    </section>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script src="../../shared/footer.js"></script>
  <script src="../../shared/navbar.js?v=2"></script>
  <script src="../../shared/hr-sidebar.js?v=3"></script>
  <script src="feedback.js"></script>
</body>
</html>
