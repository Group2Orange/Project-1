<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | HR System</title>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

  <link rel="stylesheet" href="reset-password.css">
</head>

<body>

  <main class="reset-page">

    <div class="reset-content">

      <section class="reset-container" aria-labelledby="reset-title">

        <header class="reset-header">

          <span class="reset-icon material-symbols-outlined" aria-hidden="true">
            lock_reset
          </span>

          <h1 id="reset-title">Set Your Password</h1>

          <p>
            This is your first login. Please create a new password to continue.
          </p>

        </header>

        <form id="reset-password-form">

          <div class="form-group">

            <label for="new-password">
              New Password
            </label>

            <div class="password-field">

              <input
                type="password"
                id="new-password"
                name="new-password"
                placeholder="Enter your new password"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-controls="new-password"
                aria-pressed="false"
              >
                <span class="material-symbols-outlined" aria-hidden="true">
                  visibility
                </span>
              </button>

            </div>

          </div>

          <div class="form-group">

            <label for="confirm-password">
              Confirm New Password
            </label>

            <div class="password-field">

              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your new password"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-controls="confirm-password"
                aria-pressed="false"
              >
                <span class="material-symbols-outlined" aria-hidden="true">
                  visibility
                </span>
              </button>

            </div>

            <p class="form-error" id="password-error" role="alert" hidden>

              <span
                class="material-symbols-outlined"
                aria-hidden="true"
              >
                error
              </span>

              <span id="password-error-message"></span>

            </p>

          </div>

          <div class="password-requirements">

            <p class="requirements-title">
              Password requirements:
            </p>

            <ul>
              <li>Use at least 8 characters.</li>
              <li>Use a combination of letters and numbers.</li>
            </ul>

          </div>

          <button
            type="submit"
            class="reset-btn"
          >
            Save Password

            <span class="material-symbols-outlined" aria-hidden="true">
              arrow_forward
            </span>
          </button>

        </form>

        <p class="security-note">

          <span class="material-symbols-outlined" aria-hidden="true">
            shield
          </span>

          Your password is required to access your account.

        </p>

      </section>

    </div>

  </main>

  <script src="reset-password.js"></script>

</body>

</html>
