<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HR System</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="stylesheet" href="../../shared/footer.css">
  <link rel="stylesheet" href="login.css">
</head>

<body class="has-footer">
  <main class="login-page">
    <div class="login-content">
      <section class="login-container" aria-labelledby="login-title">
        <header class="login-header">
          <span class="login-icon material-symbols-outlined" aria-hidden="true">lock</span>
          <h1 id="login-title">Welcome Back</h1>
          <p>Sign in to access your TeamSpace HR account.</p>
        </header>

        <form action="/login-endpoint" method="POST">
          <div class="form-group">
            <label for="username">Email Address</label>
            <input type="email" id="username" name="username" placeholder="alex.rivera@teamspace.hr" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
                <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
              </button>
            </div>
            <!-- Call setLoginError(true) when the server rejects the credentials. -->
            <p class="form-error" id="login-error" role="alert" hidden>
              <svg class="error-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="6.5" stroke="currentColor" />
                <path d="M8 4.5v4" stroke="currentColor" stroke-linecap="round" />
                <circle cx="8" cy="11" r=".75" fill="currentColor" />
              </svg>
              <span>Incorrect email or password.</span>
            </p>
          </div>

          <div class="form-options">
            <label class="remember-me"><input type="checkbox" name="remember"> Remember Me</label>
            <a href="../contact/contact.html">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Sign In <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></button>
        </form>

        <p class="account-help">Need an account? <a href="../contact/contact.html">Contact your HR administrator.</a></p>
      </section>
      <p class="security-note"><span class="material-symbols-outlined" aria-hidden="true">shield</span> Authorized personnel only</p>
    </div>
  </main>

  <footer class="site-footer" data-footer></footer>
  <script src="../../shared/footer.js"></script>
  <script src="login.js"></script>
</body>
</html>
